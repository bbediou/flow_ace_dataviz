# Builds the Shiny app into a static Shinylive site and publishes it to
# GitHub Pages on every push to main.
name: Deploy Shinylive app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        shell: Rscript {0}
        run: install.packages("shinylive")

      # shinylive::export() works out the app's dependency tree by inspecting
      # packages installed on THIS runner, so they must be installed here even
      # though the visitor's browser fetches WebAssembly builds at runtime.
      # Without this, find.package() fails and the export aborts.
      - name: Install the app's R packages
        shell: Rscript {0}
        run: |
          install.packages("renv")
          pkgs <- setdiff(unique(renv::dependencies("app")$Package),
                          rownames(installed.packages()))
          message("Installing: ", paste(pkgs, collapse = ", "))
          if (length(pkgs)) install.packages(pkgs)

      # Packages resolve from the runner installs above; the visitor's browser
      # downloads the matching WebAssembly builds from repo.r-wasm.org.
      - name: Export app to static site
        shell: Rscript {0}
        run: shinylive::export("app", "site")

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
